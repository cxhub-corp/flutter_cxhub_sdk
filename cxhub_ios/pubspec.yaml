name: cxhub_ios
description: "CxHub iOS implementation"
version: 0.0.2

homepage: https://cxhub.ru
repository: https://github.com/cxhub-corp/flutter_cxhub_sdk/tree/publish/cxhub_ios

environment:
  sdk: '>=3.4.3 <4.0.0'
  flutter: '>=3.3.0'

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: CxhubSdkPlugin
        dartPluginClass: CxHubSdkPlatformIos

dependencies:
  flutter:
    sdk: flutter
  cxhub_platform_interface: ^0.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
