plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
    id "com.huawei.agconnect"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def gradleProperties = new Properties()
def gradlePropertiesFile = rootProject.file("gradle.properties")
if (gradlePropertiesFile.exists()) {
    gradlePropertiesFile.withReader("UTF-8") { reader ->
        gradleProperties.load(reader)
    }
}

def flutterVersionCode = gradleProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = gradleProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}


android {
    namespace = "ru.cxhub"
    compileSdk = gradleProperties.getProperty("flutter.compileSdkVersion").toInteger()
    ndkVersion = gradleProperties.getProperty("flutter.ndkVersion")

    kotlinOptions{
        jvmTarget = "17"
    }

    java {
        toolchain {
            languageVersion.set(JavaLanguageVersion.of(17))
        }
    }

    defaultConfig {
        applicationId = "ru.cxhub.example"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdk = gradleProperties.getProperty("flutter.minSdkVersion").toInteger() //flutter.minSdkVersion
        targetSdk = gradleProperties.getProperty("flutter.targetSdkVersion").toInteger()
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
