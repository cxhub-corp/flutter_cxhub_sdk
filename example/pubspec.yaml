name: cxhub_sdk_example
description: "Demonstrates how to use the cxhub_sdk plugin."
version: 0.0.1
publish_to: none

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cxhub_sdk: ^0.0.1
  cupertino_icons: ^1.0.6
  permission_handler: ^12.0.1

## Uncomment needed part to switch to huawei|rustore implementation
## default is firebase
dependency_overrides:
  cxhub_android: 0.0.1-firebase
  #cxhub_android: 0.0.1-huawei
  #cxhub_android: 0.0.1-rustore

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true