    sdk: flutter
  cxhub_platform_interface:
    hosted: https://onepub.dev/api/ndfuuhnofl
    version: 0.0.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
