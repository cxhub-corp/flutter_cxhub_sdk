name: cxhub_android
description: "Android firebase implementation cxhub_sdk"
version: 0.0.1-firebase
publish_to: https://onepub.dev/api/afhaavuhno

environment:
  sdk: '>=3.4.3 <4.0.0'
  flutter: '>=3.3.0'

flutter:
  plugin:
    implements: cxhub_sdk
    platforms:
      android:
        package: plugin.cxhub_sdk
        pluginClass: CxHubSdkPluginFirebase
        dartPluginClass: CxHubSdkPlatformAndroid

dependencies:
  flutter:
    sdk: flutter
  cxhub_platform_interface:
    path: ../cxhub_platform_interface

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0