repository: https://gitlab.corp.mail.ru/cxhub1/flutter-sdk

environment:
  sdk: '>=3.4.3 <4.0.0'
  flutter: '>=3.3.0'

flutter:
  plugin:
    implements: cxhub_sdk
    platforms:
