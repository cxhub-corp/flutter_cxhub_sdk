name: cxhub_sdk
description: "CxHub SDK library"
version: 0.0.1
publish_to:
homepage: https://cxhub.ru/
repository:

environment:
  sdk: '>=3.4.3 <4.0.0'
  flutter: '>=3.3.0'

flutter:
  plugin:
    platforms:
      android:
        default_package: cxhub_android
      ios:
        default_package: cxhub_ios

dependencies:
  flutter:
    sdk: flutter
  cxhub_platform_interface: ^0.0.1
  cxhub_android: ^0.0.1-firebase
  cxhub_ios: ^0.0.1

#dependency_overrides:
#  cxhub_android: 0.0.1-huawei
#  cxhub_android: 0.0.1-rustore

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
