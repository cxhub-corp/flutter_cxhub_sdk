name: cxhub_sdk
description: "CxHub SDK library"
version: 0.0.1
publish_to: https://onepub.dev/api/ndfuuhnofl
homepage: https://gitlab.corp.mail.ru/cxhub1/flutter-sdk
repository: https://gitlab.corp.mail.ru/cxhub1/flutter-sdk

environment:
  sdk: '>=3.4.3 <4.0.0'
  flutter: '>=3.3.0'

flutter:
  plugin:
    platforms:
      android:
        default_package: cxhub_android
      ios:
        default_package: cxhub_ios

dependencies:
  flutter:
    sdk: flutter
  cxhub_platform_interface:
    hosted: https://onepub.dev/api/ndfuuhnofl
    version: ^0.0.2
  cxhub_android:
    hosted: https://onepub.dev/api/ndfuuhnofl
    version: ^0.0.2-firebase
  cxhub_ios:
    hosted: https://onepub.dev/api/ndfuuhnofl
    version: ^0.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
