name: cxhub_sdk_example_local
description: "Demonstrates how to use the cxhub_sdk plugin."
version: 0.0.1
publish_to: none

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cxhub_sdk: ^0.0.1
  cupertino_icons: ^1.0.6
  permission_handler: ^11.3.1

dependency_overrides:
  cxhub_sdk:
    path: ../
  cxhub_platform_interface:
    path: ../../cxhub_platform_interface
  cxhub_android:
    ## change "_firebase" to "_huawei" or "_rustore" for local build
    path: ../../cxhub_android_firebase
  cxhub_ios:
    path: ../../cxhub_ios

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true